name: build-sprites
on:
  push:
    paths:
      - 'countries.txt'
      - '.gitmodules'
      - 'Makefile'
      - 'flags-html-to-css.sed'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y imagemagick pngquant sed
      - run: make
      - name: zip artifacts
        run: cd build && zip ../esc-flags.zip flags*.*
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: esc-flags.zip